[project]
name = "corridor-solver-py"
version = "0.1.0"
description = "Neuro-Symbolic Corridor Solver: Guided BoL Parser, T-GNN Warm-Start, Z3 SMT Regulatory Compiler, and HiGHS MILP Optimizer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "scipy>=1.14.0",
    "highspy>=1.7.0",
    "z3-solver>=4.13.0",
    "numpy>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
