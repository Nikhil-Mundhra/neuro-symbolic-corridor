[project]
name = "corridor-solver-py"
version = "0.1.0"
description = "Neuro-Symbolic Corridor Solver: Guided BoL Parser, T-GNN Warm-Start, Z3 SMT Regulatory Compiler, and HiGHS MILP Optimizer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "scipy>=1.14.0",
    "highspy>=1.7.0",
    "z3-solver>=4.13.0",
    "numpy>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "unit: Fast isolated L1 unit tests",
    "property: L1.5 Hypothesis property-based & Z3/MILP mathematical invariant fuzzing",
    "contract: L2 Cross-service JSON schema & boundary contract tests",
    "sla: L3 Sub-400ms P99 latency & stage budget enforcement gates",
    "e2e: L4 Full cross-service Go Gateway <-> Python Solver integration tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
